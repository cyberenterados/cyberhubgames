<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemetría de Tiempo Global - Búnker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Capa de fondo dinámico -->
    <canvas id="bgCanvas"></canvas>
    
    <!-- Interfaz Clandestina -->
    <div class="terminal-container">
        <div class="hud-box">
            <div id="location-data" class="hud-text">[ UBICANDO COORDENADAS... ]</div>
            <div id="clock-display" class="clock-text">00:00:00</div>
            <div id="date-display" class="hud-text">--/--/----</div>
            <div id="weather-data" class="hud-text">[ CLIMA: STANDBY... ]</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
