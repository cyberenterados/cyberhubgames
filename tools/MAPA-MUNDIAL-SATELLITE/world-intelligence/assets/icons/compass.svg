<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Círculos concéntricos de latón vintage -->
  <circle cx="60" cy="60" r="56" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.8" />
  <circle cx="60" cy="60" r="52" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.6" />
  <circle cx="60" cy="60" r="44" stroke="#d4af37" stroke-width="1.2" stroke-opacity="0.7" />
  <circle cx="60" cy="60" r="18" stroke="#d4af37" stroke-width="1.2" stroke-opacity="0.9" />
  
  <!-- Graduaciones angulares (puntos de compás) -->
  <g stroke="#d4af37" stroke-width="0.8" stroke-opacity="0.5">
    <line x1="60" y1="4" x2="60" y2="12" />
    <line x1="60" y1="108" x2="60" y2="116" />
    <line x1="4" y1="60" x2="12" y2="60" />
    <line x1="108" y1="60" x2="116" y2="60" />
    <line x1="20" y1="20" x2="26" y2="26" />
    <line x1="100" y1="20" x2="94" y2="26" />
    <line x1="20" y1="100" x2="26" y2="94" />
    <line x1="100" y1="100" x2="94" y2="94" />
  </g>

  <!-- Puntos secundarios (NW, NE, SE, SW) -->
  <polygon points="60,60 30,30 60,54" fill="#8c6d1f" />
  <polygon points="60,60 30,30 54,60" fill="#6d5415" />
  <polygon points="60,60 90,30 60,54" fill="#b38e2d" />
  <polygon points="60,60 90,30 66,60" fill="#8c6d1f" />
  <polygon points="60,60 90,90 60,66" fill="#6d5415" />
  <polygon points="60,60 90,90 66,60" fill="#8c6d1f" />
  <polygon points="60,60 30,90 60,66" fill="#8c6d1f" />
  <polygon points="60,60 30,90 54,60" fill="#b38e2d" />

  <!-- Aguja Principal Norte (Oro viejo brillante) -->
  <polygon points="60,8 54,60 60,52" fill="#d4af37" />
  <polygon points="60,8 66,60 60,52" fill="#f5eedc" />

  <!-- Aguja Sur (Latón oscuro) -->
  <polygon points="60,112 54,60 60,68" fill="#594411" />
  <polygon points="60,112 66,60 60,68" fill="#7a5d17" />

  <!-- Aguja Este -->
  <polygon points="112,60 60,54 68,60" fill="#a68224" />
  <polygon points="112,60 60,66 68,60" fill="#c59b27" />

  <!-- Aguja Oeste -->
  <polygon points="8,60 60,54 52,60" fill="#7a5d17" />
  <polygon points="8,60 60,66 52,60" fill="#a68224" />

  <!-- Remache central vintage con zafiro náutico -->
  <circle cx="60" cy="60" r="5" fill="#d4af37" stroke="#332406" stroke-width="1" />
  <circle cx="60" cy="60" r="2.5" fill="#00e5ff" />

  <!-- Tipografía Cardinal Clásica -->
  <text x="60" y="7" fill="#f5eedc" font-family="'Cinzel', 'Georgia', serif" font-weight="700" font-size="10" text-anchor="middle">N</text>
  <text x="60" y="119" fill="#d4af37" font-family="'Cinzel', 'Georgia', serif" font-weight="700" font-size="10" text-anchor="middle">S</text>
  <text x="119" y="63.5" fill="#d4af37" font-family="'Cinzel', 'Georgia', serif" font-weight="700" font-size="10" text-anchor="middle">E</text>
  <text x="1" y="63.5" fill="#d4af37" font-family="'Cinzel', 'Georgia', serif" font-weight="700" font-size="10" text-anchor="middle">O</text>
</svg>
